
name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_summary_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d book_summary_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/book_summary_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
